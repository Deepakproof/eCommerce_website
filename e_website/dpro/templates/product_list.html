<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meesho Product UI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f1f1f1;
    }

    header {
      background-color: #ffffff;
      padding: 15px 20px;
      font-size: 22px;
      font-weight: 600;
      border-bottom: 1px solid #ccc;
      text-align: center;
      color: #333;
    }

    .product-section {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 15px;
      padding: 20px;
      background-color: #f8f8f8;
    }

    .product-card {
      background-color: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      transition: transform 0.2s ease-in-out;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-bottom: 1px solid #eee;
    }

    .product-details {
      padding: 10px;
      flex-grow: 1;
    }

    .product-title {
      font-size: 14px;
      color: #333;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .product-price {
      font-size: 16px;
      font-weight: bold;
      color: #e91e63;
      margin-bottom: 10px;
    }

    .add-cart {
      background-color: #e91e63;
      color: #fff;
      border: none;
      padding: 8px;
      width: 100%;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .add-cart:hover {
      background-color: #c2185b;
    }

    @media (max-width: 480px) {
      .product-image {
        height: 150px;
      }
    }
  </style>
</head>
<body>

  <header>Meesho - Trending Products</header>

  <div class="product-section" id="productGrid">
    <!-- JavaScript will load product cards here -->
  </div>

  <script>
    const products = [
      {
        name: "Trendy Cotton Kurti",
        price: "₹349",
        image: "https://images.meesho.com/images/products/81245638/qsbhq_512.jpg"
      },
      {
        name: "Stylish Sling Bag",
        price: "₹449",
        image: "https://images.meesho.com/images/products/70678653/2fufo_512.jpg"
      },
      {
        name: "Fancy Sandals for Women",
        price: "₹299",
        image: "https://images.meesho.com/images/products/72908330/ve9zi_512.jpg"
      },
      {
        name: "Kids Dress Combo Set",
        price: "₹599",
        image: "https://images.meesho.com/images/products/48920790/ybeyj_512.jpg"
      },
      {
        name: "Ethnic Party Earrings",
        price: "₹199",
        image: "https://images.meesho.com/images/products/105019420/a7g2g_512.jpg"
      },
      {
        name: "Printed Mobile Back Cover",
        price: "₹149",
        image: "https://images.meesho.com/images/products/244045990/vnr5c_512.jpg"
      }
    ];

    const productGrid = document.getElementById("productGrid");

    products.forEach(p => {
      const card = document.createElement("div");
      card.className = "product-card";
      card.innerHTML = `
        <img class="product-image" src="${p.image}" alt="${p.name}" />
        <div class="product-details">
          <div class="product-title">${p.name}</div>
          <div class="product-price">${p.price}</div>
          <button class="add-cart" onclick="addToCart('${p.name}')">Add to Cart</button>
        </div>
      `;
      productGrid.appendChild(card);
    });

    function addToCart(productName) {
      alert(`🛍️ "${productName}" added to cart!`);
    }
  </script>

</body>
</html>
